<!DOCTYPE html>
<head>
   <title>Annual Marksheet</title>
   <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 30px;
      }

      .marksheet {
        width: 90%;
        max-width: 900px;
        margin: 20px auto;
        padding: 25px;
        border: 2px solid #ccc;
      }

      h2 {
        text-align: center;
        margin-bottom: 20px;
        text-decoration: underline;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        text-align: center;
      }
      th,td {
        border: 1px solid #ccc;
        padding: 10px;
      }
      th {
        background-color: #f2f2f2;
        font-weight: bold;
      }
      .title {
        background-color: #4CAF50;
        font-size: 18px;
      }
      .name {
        text-align: left;
        padding-left: 15px;
      }
      tfoot {
        font-weight: bold;
        background-color: #f2f2f2;
      }
      @media (max-width: 600px) {
        body {
          padding: 15px;
        }
        marksheet{
          width: 100%;
          padding: 15px;  
        }
        table{
          min-width: 550px;
        }
        th, td {
          padding: 8px;
        }
      }
   </style>
</head>
<body>
